<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080px" height="1706px" viewBox="0 0 1080 1706">
<title>Persian messages</title>
<defs></defs>
<rect id="Artboard_background" width="1080" height="1706" fill="#FFFFFF"/>
<text x="1040" y="50" font-family="'IRANSansX-Black', 'IRANSansX', sans-serif" font-weight="900" font-size="32" fill="#004C6A" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">همه‌ی پیام‌های فارسی بازی</text><g id="msg_text_title"><text x="1040" y="120" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">هاکی بازار</text><text x="40" y="120" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.title</text></g><g id="msg_text_subtitle"><text x="1040" y="178" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="end" dominant-baseline="central" >MARKET HOCKEY</text><text x="40" y="178" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.subtitle</text></g><g id="msg_text_attract_prompt"><text x="1040" y="236" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">برای شروع، روبه‌روی هم بایستید</text><text x="40" y="236" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.attract_prompt</text></g><g id="msg_text_ready"><text x="1040" y="294" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">آماده‌اید؟</text><text x="40" y="294" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.ready</text></g><g id="msg_text_go"><text x="1040" y="352" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">شروع!</text><text x="40" y="352" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.go</text></g><g id="msg_text_goal"><text x="1040" y="410" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">گل!</text><text x="40" y="410" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.goal</text></g><g id="msg_text_golden_goal"><text x="1040" y="468" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">گل طلایی!</text><text x="40" y="468" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.golden_goal</text></g><g id="msg_text_final"><text x="1040" y="526" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">پایان معاملات!</text><text x="40" y="526" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.final</text></g><g id="msg_text_winner"><text x="1040" y="584" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">برنده</text><text x="40" y="584" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.winner</text></g><g id="msg_text_draw"><text x="1040" y="642" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">مساوی</text><text x="40" y="642" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.draw</text></g><g id="msg_text_slogan"><text x="1040" y="700" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازار همیشه در حرکته؛ آماده‌ی تغییر باش.</text><text x="40" y="700" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.slogan</text></g><g id="msg_text_paused"><text x="1040" y="758" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">توقف</text><text x="40" y="758" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.paused</text></g><g id="msg_text_step_in"><text x="1040" y="816" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">وارد زمین شوید</text><text x="40" y="816" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.step_in</text></g><g id="msg_text_smart_hit"><text x="1040" y="874" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">واکنش به‌موقع!</text><text x="40" y="874" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.smart_hit</text></g><g id="msg_text_player_1"><text x="1040" y="932" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازیکن 1</text><text x="40" y="932" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.player_1</text></g><g id="msg_text_player_2"><text x="1040" y="990" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازیکن 2</text><text x="40" y="990" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">text.player_2</text></g><g id="msg_powerups_types_expand_toast_collector"><text x="1040" y="1048" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بالکرت بزرگ شد!</text><text x="40" y="1048" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.expand.toast_collector</text></g><g id="msg_powerups_types_shrink_toast_collector"><text x="1040" y="1106" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بالکر حریف کوچک شد!</text><text x="40" y="1106" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.shrink.toast_collector</text></g><g id="msg_powerups_types_shrink_toast_opponent"><text x="1040" y="1164" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بالکرت کوچک شد!</text><text x="40" y="1164" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.shrink.toast_opponent</text></g><g id="msg_powerups_types_speed_up_toast_collector"><text x="1040" y="1222" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">نوسان بازار افزایش یافت!</text><text x="40" y="1222" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.speed_up.toast_collector</text></g><g id="msg_powerups_types_chaos_toast_collector"><text x="1040" y="1280" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازار غیرقابل پیش‌بینی شد!</text><text x="40" y="1280" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.chaos.toast_collector</text></g><g id="msg_powerups_types_double_ball_toast_collector"><text x="1040" y="1338" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">حجم معاملات افزایش یافت!</text><text x="40" y="1338" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.double_ball.toast_collector</text></g><g id="msg_powerups_types_trajectory_reveal_toast_collector"><text x="1040" y="1396" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">مسیر حرکت را تحلیل کن!</text><text x="40" y="1396" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.trajectory_reveal.toast_collector</text></g><g id="msg_powerups_types_slow_down_toast_collector"><text x="1040" y="1454" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازار وارد دوره‌ی آرام شد.</text><text x="40" y="1454" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.slow_down.toast_collector</text></g><g id="msg_powerups_types_dim_ball_toast_collector"><text x="1040" y="1512" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازار در مسیر اصلاح قرار گرفت.</text><text x="40" y="1512" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.dim_ball.toast_collector</text></g><g id="msg_powerups_types_shield_toast_collector"><text x="1040" y="1570" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">حد نوسان فعال شد!</text><text x="40" y="1570" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.shield.toast_collector</text></g><g id="msg_powerups_types_bull_market_toast_collector"><text x="1040" y="1628" font-family="'IRANSansX-Bold', 'IRANSansX', sans-serif" font-weight="700" font-size="30" fill="#13252E" text-anchor="start" dominant-baseline="central"  direction="rtl" unicode-bidi="embed">بازار صعودی! گل بعدی دو امتیازی</text><text x="40" y="1628" font-family="'IRANSansX-Regular', 'IRANSansX', sans-serif" font-weight="400" font-size="13" fill="#8AA0AA" text-anchor="start" dominant-baseline="central" direction="ltr">powerups.types.bull_market.toast_collector</text></g>
</svg>
