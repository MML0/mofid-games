<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="wallClip"><rect x="40" y="70" width="500" height="310"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowBall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6338a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff"/>

  <!-- ============ FRONT VIEW ============ -->
  <text x="40" y="46" font-size="19" font-weight="600" fill="#1f2430">Front view (looking at the wall)</text>

  <rect x="40" y="70" width="500" height="310" fill="#eef1f5" stroke="#c3cad6"/>

  <!-- laser plane fan -->
  <g clip-path="url(#wallClip)">
    <path d="M290,372 L-10,372 A300,300 0 0 1 590,372 Z" fill="#e53935" fill-opacity="0.07"/>
    <g stroke="#e53935" stroke-opacity="0.22" stroke-width="1">
      <line x1="290" y1="372" x2="-10" y2="372"/>
      <line x1="290" y1="372" x2="30" y2="222"/>
      <line x1="290" y1="372" x2="140" y2="112"/>
      <line x1="290" y1="372" x2="290" y2="72"/>
      <line x1="290" y1="372" x2="440" y2="112"/>
      <line x1="290" y1="372" x2="550" y2="222"/>
      <line x1="290" y1="372" x2="590" y2="372"/>
    </g>
  </g>

  <!-- touch area -->
  <rect x="100" y="110" width="380" height="230" fill="#2f6fde" fill-opacity="0.07" stroke="#2f6fde" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="110" y="132" font-size="14" fill="#2f6fde" font-weight="600">touch area</text>
  <text x="110" y="150" font-size="12.5" fill="#2f6fde">circle / square / rectangle, set in the window</text>

  <!-- hit -->
  <circle cx="205" cy="200" r="15" fill="#ff3fb4"/>
  <circle cx="205" cy="200" r="4" fill="#ffffff"/>
  <text x="228" y="196" font-size="14" font-weight="600" fill="#d6338a">HIT</text>
  <text x="228" y="214" font-size="12.5" fill="#d6338a">OSC /touch [x, y, id, 1]</text>

  <!-- floor + lidar -->
  <line x1="30" y1="380" x2="550" y2="380" stroke="#4a4f5a" stroke-width="3"/>
  <text x="44" y="400" font-size="12.5" fill="#4a4f5a">floor</text>
  <rect x="279" y="362" width="22" height="16" rx="3" fill="#1f2430"/>
  <circle cx="290" cy="368" r="3" fill="#ff5252"/>
  <line x1="318" y1="405" x2="298" y2="381" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="322" y="414" font-size="13" fill="#1f2430"><tspan font-weight="600">STL27L lidar</tspan> about 5 cm above the floor</text>
  <text x="44" y="94" font-size="12.5" fill="#b3261e">laser plane: 360°, about 2178 points per turn, 10 Hz</text>

  <!-- ============ SIDE VIEW ============ -->
  <text x="600" y="46" font-size="19" font-weight="600" fill="#1f2430">Side view</text>

  <!-- wall -->
  <rect x="880" y="70" width="22" height="310" fill="#c9d0db"/>
  <text x="872" y="64" font-size="12.5" fill="#4a4f5a" text-anchor="end">wall</text>

  <!-- floor -->
  <line x1="600" y1="380" x2="920" y2="380" stroke="#4a4f5a" stroke-width="3"/>

  <!-- laser plane (edge on) -->
  <line x1="845" y1="76" x2="845" y2="364" stroke="#e53935" stroke-width="3"/>
  <rect x="836" y="364" width="18" height="14" rx="3" fill="#1f2430"/>

  <!-- gap to wall -->
  <line x1="849" y1="110" x2="876" y2="110" stroke="#444" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="836" y="104" font-size="13" font-weight="600" fill="#1f2430" text-anchor="end">12–15 cm</text>

  <!-- ball path -->
  <path d="M615,300 Q735,150 866,198" fill="none" stroke="#d6338a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowBall)"/>
  <circle cx="660" cy="232" r="11" fill="#ff3fb4" fill-opacity="0.35"/>
  <circle cx="845" cy="192" r="11" fill="#ff3fb4"/>
  <text x="610" y="324" font-size="13" fill="#d6338a">throw</text>

  <text x="604" y="420" font-size="12.5" fill="#1f2430">A fast ball is inside the plane for less than</text>
  <text x="604" y="437" font-size="12.5" fill="#1f2430">100 ms, so at 10 Hz it is often seen in only</text>
  <text x="604" y="454" font-size="12.5" fill="#1f2430">one scan. That scan is the hit.</text>

  <text x="40" y="447" font-size="12.5" fill="#4a4f5a">The red plane is what the lidar sees. Anything that breaks it inside the touch area is a hit.</text>
</svg>
